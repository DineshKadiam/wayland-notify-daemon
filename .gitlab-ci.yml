stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: normal

before_script:
  - echo "http://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
  - apk update
  - apk add musl-dev linux-headers meson ninja gcc scdoc
  - apk add pixman-dev freetype-dev fontconfig-dev libpng-dev dbus-dev
  - apk add wayland-dev wayland-protocols wlroots-dev
  - apk add python3 py3-pip git

debug-x64:
  image: alpine:edge
  stage: build
  script:
    - mkdir -p bld/debug
    - meson --buildtype=debug . bld/debug
    - ninja -C bld/debug -v -k0

debug-x86:
  image: i386/alpine:edge
  stage: build
  script:
    - mkdir -p bld/debug
    - meson --buildtype=debug . bld/debug
    - ninja -C bld/debug -v -k0

release-x64:
  image: alpine:edge
  stage: build
  script:
    - mkdir -p bld/release
    - meson --buildtype=release . bld/release
    - ninja -C bld/release -v -k0

release-x86:
  image: i386/alpine:edge
  stage: build
  script:
    - mkdir -p bld/release
    - meson --buildtype=release . bld/release
    - ninja -C bld/release -v -k0

codespell:
  image: alpine:edge
  stage: build
  script:
    - apk add python3
    - apk add py3-pip
    - pip install codespell
    - codespell *.c *.h
